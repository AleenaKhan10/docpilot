# Nginx site config for the DocPilot backend.
#
# Goes on the HOST (not in Docker), at:
#   /etc/nginx/sites-available/docpilot
# then symlink:
#   ln -s /etc/nginx/sites-available/docpilot /etc/nginx/sites-enabled/docpilot
#
# Replace `api.yourdomain.com` everywhere before installing.
# SSL is added by Certbot after this file is in place (see DEPLOY.md).

# Redirect plain http → https (Certbot will add this block; keeping a stub
# here so the config is sensible before SSL is wired up).
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Allow Let's Encrypt challenges through.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # SSL — Certbot fills these in via `certbot --nginx`.
    # ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Modest body cap — covers our 500 MB upload limit + multipart overhead.
    client_max_body_size 550M;

    # WebSocket upgrade for /ws/* (Celery progress channel).
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Long video uploads can take many minutes — bump the read timeout.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Gzip JSON responses.
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # Tighten the default headers (CORS is handled by FastAPI, don't double-set).
    server_tokens off;
}
