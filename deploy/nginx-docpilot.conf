# Nginx site config for the DocPilot backend.
#
# Goes on the HOST (not in Docker), at:
#   /etc/nginx/sites-available/docpilot
# then symlink:
#   ln -s /etc/nginx/sites-available/docpilot /etc/nginx/sites-enabled/docpilot
#
# Replace `api.yourdomain.com` everywhere before installing.
#
# This is the PRE-SSL config (port 80 only). After `certbot --nginx -d ...`
# runs, certbot rewrites this file: it adds a second `server { listen 443 ssl; ... }`
# block with the cert paths filled in, and turns the port-80 location into
# a redirect to https. Don't manage SSL by hand here.

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Modest body cap — covers our 500 MB upload limit + multipart overhead.
    client_max_body_size 550M;

    # Allow Let's Encrypt http-01 challenges through.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # WebSocket upgrade for /ws/* (Celery progress channel).
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Long video uploads can take many minutes — bump the read timeout.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Gzip JSON responses.
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # CORS is handled by FastAPI, don't double-set.
    server_tokens off;
}
